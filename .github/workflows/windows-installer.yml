name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build installer
        run: bun run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check the bundled Claude binary is in the app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse dist/win-unpacked -Filter claude.exe | Select-Object -First 1
          if (-not $exe) { throw "claude.exe from @anthropic-ai/claude-agent-sdk-win32-x64 is missing from the build" }
          Write-Host "Found $($exe.FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: LMCanvas-Windows-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
